maturity_model:

  level_0:

    name: Non-existent

    description: >
      Power Platform usage is unmanaged with no governance or
      security controls.

  level_1:

    name: Initial

    description: >
      Basic administration exists but environments, applications
      and makers are largely unmanaged.

  level_2:

    name: Managed

    description: >
      Governance processes, DLP policies and administrative controls
      are implemented consistently.

  level_3:

    name: Defined

    description: >
      Environment strategy, ALM, monitoring and security controls
      are standardised across the organisation.

  level_4:

    name: Optimised

    description: >
      Governance is automated using policy, monitoring, analytics
      and continuous compliance assessment.

