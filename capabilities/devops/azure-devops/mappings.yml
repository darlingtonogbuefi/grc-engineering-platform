id: devops

name: DevSecOps Framework Mappings

version: "1.0.0"

description: >
  Maps DevSecOps capability controls to external compliance
  frameworks. Capability controls remain framework-independent
  and represent engineering security outcomes.

mappings:

  #
  # DEVOPS-001 Repository Security
  #

  DEVOPS-001:

    name: Source Code Repository Security

    frameworks:

      CAF:
        controls:
          - id: B3.b
            name: Secure administration

      ISO27001:
        controls:
          - id: A.5.15
            name: Access control
          - id: A.5.18
            name: Access rights

      SOC2:
        controls:
          - id: CC6.1
          - id: CC6.2

      GovAssure:
        controls:
          - id: PR.AC

      CyberEssentials:
        controls:
          - id: Access Control

  #
