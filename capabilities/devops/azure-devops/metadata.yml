id: devops

name: DevSecOps

version: "1.0.0"

description: >
  The DevSecOps capability ensures that software is designed,
  developed, tested, deployed and maintained using secure,
  repeatable and auditable engineering practices. It integrates
  security throughout the software development lifecycle (SDLC),
  protects software supply chains, secures CI/CD pipelines,
  and provides governance over source code, build systems,
  deployment processes and development infrastructure.

purpose: >
  Reduce software supply chain risk by embedding security into
  development processes, automating security controls, enforcing
  secure coding practices, protecting development platforms,
  and ensuring complete traceability from source code through
  deployment into production.

capability_domain:

  category: Engineering Security

  domains:

    - Secure Software Development
    - DevSecOps
    - Software Supply Chain Security
    - CI/CD Security
    - Source Code Management
    - Infrastructure as Code
    - Release Management
    - Application Security
    - Change Management
    - Platform Engineering

business_objectives:

  - >
    Integrate security throughout the software development lifecycle.

  - >
    Protect source code and development platforms from unauthorised
    access or modification.

  - >
    Ensure software changes are reviewed, approved and fully auditable.

  - >
    Secure CI/CD pipelines against compromise.

  - >
    Detect vulnerabilities before deployment.

  - >
    Prevent secrets from being exposed within repositories or pipelines.

  - >
    Maintain integrity of software artefacts throughout the build
    and deployment lifecycle.

  - >
    Improve software resilience through secure engineering practices.

capability_objectives:

  - id: DEVOPS-OBJ-001

    name: Source Code Governance

    description: >
      Source code repositories are protected through strong
      authentication, access control, branch protection and
      code ownership.

  - id: DEVOPS-OBJ-002

    name: Secure Development Lifecycle

    description: >
      Security activities are integrated throughout planning,
      development, testing and release processes.

  - id: DEVOPS-OBJ-003

    name: Secure CI/CD Pipelines

    description: >
      Build and deployment pipelines are secured, monitored
      and protected from unauthorised modification.

  - id: DEVOPS-OBJ-004

    name: Software Supply Chain Security

    description: >
      Third-party dependencies, packages and build artefacts
      are validated and monitored.

  - id: DEVOPS-OBJ-005

    name: Infrastructure as Code Security

    description: >
      Infrastructure definitions are version controlled,
      reviewed and security validated before deployment.

  - id: DEVOPS-OBJ-006

    name: Secrets Management

    description: >
      Secrets are securely stored, rotated and never embedded
      within source code or deployment pipelines.

  - id: DEVOPS-OBJ-007

    name: Release Governance

    description: >
      Production releases follow approved change control,
      testing and deployment processes.

  - id: DEVOPS-OBJ-008

    name: Security Monitoring

    description: >
      Development platforms and deployment activities are
      logged, monitored and investigated.

