maturity_model:

  level_0:

    name: Non-existent

    description: >
      Development activities are unmanaged with no defined
      security practices.

  level_1:

    name: Initial

    description: >
      Basic version control and manual development practices
      exist with limited security controls.

  level_2:

    name: Managed

    description: >
      Secure development standards are documented and
      consistently applied across projects.

  level_3:

    name: Defined

    description: >
      CI/CD pipelines enforce automated testing, code review,
      vulnerability scanning and deployment governance.

  level_4:

    name: Optimised

    description: >
      Security is fully integrated into engineering workflows
      using automation, policy enforcement and continuous
      software supply chain monitoring.

