id: cloud

name: Cloud Security Governance

version: "1.0.0"

description: >
  The Cloud Security capability provides governance, security and
  operational controls for cloud platforms and services. It ensures
  cloud environments are securely designed, configured, monitored
  and operated throughout their lifecycle.

  The capability supports public, private and hybrid cloud
  environments including Microsoft Azure, Amazon Web Services,
  Google Cloud Platform and connected infrastructure platforms.

purpose: >
  Establish a secure cloud operating model that manages cloud
  resources, identities, configurations, workloads, data protection,
  monitoring and resilience while enabling controlled cloud adoption.

capability_domain:

  category: Cloud Security

  domains:

    - Cloud Governance
    - Cloud Architecture
    - Cloud Identity
    - Cloud Infrastructure
    - Cloud Networking
    - Cloud Workloads
    - Cloud Data Protection
    - Cloud Monitoring
    - Cloud Resilience
    - Cloud Security Posture Management


business_objectives:

  - >
    Ensure cloud services are deployed using approved security
    standards.

  - >
    Maintain visibility of all cloud assets and resources.

  - >
    Protect cloud workloads, identities and data.

  - >
    Prevent insecure cloud configurations.

  - >
    Apply consistent governance across cloud platforms.

  - >
    Detect and respond to cloud security threats.

  - >
    Ensure cloud services meet organisational compliance
    requirements.

  - >
    Provide resilient cloud services through backup and recovery
    controls.


capability_objectives:


  - id: CLOUD-OBJ-001

    name: Cloud Governance

    description: >
      Cloud environments operate under defined governance,
      ownership and security policies.


  - id: CLOUD-OBJ-002

    name: Cloud Asset Management

    description: >
      Cloud resources are inventoried, classified and managed
      throughout their lifecycle.


  - id: CLOUD-OBJ-003

    name: Secure Cloud Architecture

    description: >
      Cloud platforms follow secure architecture principles,
      landing zone standards and design patterns.


  - id: CLOUD-OBJ-004

    name: Cloud Identity Security

    description: >
      Cloud identities, roles and permissions follow least
      privilege and strong authentication practices.


  - id: CLOUD-OBJ-005

    name: Cloud Network Security

    description: >
      Cloud networks are segmented, protected and monitored.


  - id: CLOUD-OBJ-006

    name: Cloud Configuration Management

    description: >
      Cloud resources are securely configured and continuously
      assessed.


  - id: CLOUD-OBJ-007

    name: Cloud Data Protection

    description: >
      Cloud-hosted data is protected through encryption,
      access control and lifecycle management.


  - id: CLOUD-OBJ-008

    name: Cloud Workload Security

    description: >
      Cloud workloads are protected against vulnerabilities,
      compromise and unauthorised activity.


  - id: CLOUD-OBJ-009

    name: Cloud Monitoring and Detection

    description: >
      Cloud activity, security events and operational events are
      monitored and investigated.


  - id: CLOUD-OBJ-010

    name: Cloud Resilience

    description: >
      Cloud services maintain availability through backup,
      recovery and resilience controls.


