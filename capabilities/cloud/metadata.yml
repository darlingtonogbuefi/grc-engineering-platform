maturity_model:


  level_0:

    name: Non-existent

    description: >
      Cloud services are unmanaged with no formal governance,
      ownership or security controls.


  level_1:

    name: Initial

    description: >
      Cloud adoption exists but security practices are inconsistent
      and largely manual.


  level_2:

    name: Managed

    description: >
      Cloud governance, asset management and baseline security
      controls are established.


  level_3:

    name: Defined

    description: >
      Cloud security architecture, automation, monitoring and
      compliance processes are standardised.


  level_4:

    name: Optimised

    description: >
      Cloud security is continuously improved through automation,
      policy enforcement, threat intelligence and advanced
      security analytics.


