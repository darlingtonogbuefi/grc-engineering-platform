id: cloud

name: Cloud Security Framework Mappings

version: "1.0.0"

description: >
  Maps cloud security capability controls to recognised cybersecurity
  frameworks. These mappings allow cloud evidence to contribute to
  compliance assessments without coupling cloud engineering controls
  directly to a specific framework.


mappings:


  #
  # CLOUD-001 Cloud Governance
  #

  CLOUD-001:

    name: Cloud Governance Framework


    frameworks:


      CAF:

        controls:

          - id: B1.a
            name: Governance and leadership


          - id: B3.a
            name: Security governance



      ISO27001:

        controls:

          - id: A.5.1
            name: Policies for information security


          - id: A.5.2
            name: Information security roles and responsibilities


          - id: A.5.37
            name: Documented operating procedures



      SOC2:

        controls:

          - id: CC1.1

          - id: CC1.2

          - id: CC1.3



      GovAssure:

        controls:

          - id: GV.OC
            name: Governance and oversight



      CyberEssentials:

        controls:

          - id: Secure Configuration



  #
  # CLOUD-002 Asset Management
  #

  CLOUD-002:

    name: Cloud Asset Inventory


    frameworks:


      CAF:

        controls:

          - id: A1.a
            name: Asset management



      ISO27001:

        controls:

          - id: A.5.9
            name: Inventory of information and other associated assets



      SOC2:

        controls:

          - id: CC6.1

          - id: CC7.1



      GovAssure:

        controls:

          - id: ID.AM
            name: Asset management



      CyberEssentials:

        controls:

          - id: Asset Management



  #
  # CLOUD-003 Secure Architecture
  #

  CLOUD-003:

    name: Secure Cloud Architecture


    frameworks:


      CAF:

        controls:

          - id: B3.b
            name: Secure architecture


          - id: B3.c
            name: Secure development and deployment



      ISO27001:

        controls:

          - id: A.5.23
            name: Information security for use of cloud services


          - id: A.8.27
            name: Secure system architecture and engineering principles



      SOC2:

        controls:

          - id: CC6.6

          - id: CC8.1



      GovAssure:

        controls:

          - id: PR.IP
            name: Platform integrity



  #
  # CLOUD-004 Identity Security
  #

  CLOUD-004:

    name: Cloud Identity and Access Management


    frameworks:


      CAF:

        controls:

          - id: B2.a
            name: Identity verification, authentication and authorisation


          - id: B2.c
            name: Privileged user management



      ISO27001:

        controls:

          - id: A.5.15
            name: Access control


          - id: A.5.16
            name: Identity management


          - id: A.5.17
            name: Authentication information


          - id: A.5.18
            name: Access rights



      SOC2:

        controls:

          - id: CC6.1

          - id: CC6.2

          - id: CC6.3



      GovAssure:

        controls:

          - id: PR.AA
            name: Identity management



      CyberEssentials:

        controls:

          - id: User Access Control



  #
  # CLOUD-005 Network Security
  #

  CLOUD-005:

    name: Cloud Network Security


    frameworks:


      CAF:

        controls:

          - id: B3.b
            name: Secure architecture



      ISO27001:

        controls:

          - id: A.8.20
            name: Networks security


          - id: A.8.22
            name: Segregation of networks



      SOC2:

        controls:

          - id: CC6.6



      GovAssure:

        controls:

          - id: PR.DS
            name: Data security



      CyberEssentials:

        controls:

          - id: Firewalls

          - id: Secure Configuration



