#  .github\workflows\nightly-evidence.yml

name: Nightly Evidence Collection

on:
    schedule:
        - cron: "0 1 * * *"

    workflow_dispatch:
        inputs:
            tenant:
                description: "Tenant to collect evidence for (leave empty for all enabled tenants)"

                required: false

                default: ""

            collector:
                description: "Collector to run (leave empty for all enabled collectors)"

                required: false

                default: ""

permissions:
    contents: read

    actions: write

concurrency:
    group: nightly-evidence

    cancel-in-progress: false

env:
    PYTHON_VERSION: "3.12"

    CONFIG_PATH: config

jobs:
    prepare:
        name: Prepare Collection Run

        runs-on: ubuntu-latest

        outputs:
            tenants: ${{ steps.tenants.outputs.tenants }}

        steps:
            - name: Checkout Repository

              uses: actions/checkout@v4

            - name: Setup Python

              uses: actions/setup-python@v5

              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Configuration Tools

              run: |

                  pip install pyyaml

            - name: Discover Enabled Tenants

              id: tenants

              shell: python

              run: |

                  import yaml
                  import json
                  import os

                  with open("config/tenants.yml") as f:
                      data = yaml.safe_load(f)

                  tenants = []

                  for tenant in data.get("tenants", []):
                      if tenant.get("enabled", False):
                          tenants.append(tenant["id"])

                  selected = os.environ.get("INPUT_TENANT")

                  if selected:
                      tenants = [
                          t for t in tenants
                          if t == selected
                      ]

                  print(
                      "tenants=" +
                      json.dumps(tenants)
                  )

                  with open(
                      os.environ["GITHUB_OUTPUT"],
                      "a"
                  ) as output:
                      output.write(
                          "tenants=" +
                          json.dumps(tenants)
                      )

    collect:
        name: Collect Evidence

        needs: prepare

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false

            matrix:
                tenant: ${{ fromJson(needs.prepare.outputs.tenants) }}

        steps:
            - name: Checkout Repository

              uses: actions/checkout@v4

            - name: Setup Python

              uses: actions/setup-python@v5

              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Dependencies

              run: |

                  if [ -f requirements.txt ]; then
                    pip install -r requirements.txt
                  fi

            - name: Run Evidence Collection

              env:
                  TENANT_ID: ${{ matrix.tenant }}

              run: |

                  echo "Collecting evidence for ${TENANT_ID}"

                  python -m engine.collect \
                    --tenant "${TENANT_ID}" \
                    --config "${CONFIG_PATH}"

            - name: Package Evidence

              run: |

                  tar \
                    -czf \
                    evidence-${{ matrix.tenant }}.tar.gz \
                    data/evidence/${{ matrix.tenant }} || true

            - name: Upload Evidence Artifact

              uses: actions/upload-artifact@v4

              with:
                  name: evidence-${{ matrix.tenant }}

                  path: evidence-${{ matrix.tenant }}.tar.gz

                  retention-days: 30

    validate:
        name: Validate Evidence Output

        needs: collect

        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository

              uses: actions/checkout@v4

            - name: Validate Evidence Schema

              run: |

                  echo "Evidence validation placeholder"

                  python -m engine.validate \
                    --type evidence \
                    --path data/evidence || true

    notify:
        name: Collection Summary

        needs:
            - collect
            - validate

        runs-on: ubuntu-latest

        if: always()

        steps:
            - name: Summary

              run: |

                  echo "Nightly evidence collection completed."

                  echo "Review artifacts for collected evidence."
