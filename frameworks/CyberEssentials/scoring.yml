# Cyber Essentials Assessment Scoring Model
# scoring.yml

framework: Cyber Essentials
version: "2023"

scoring_model:
  type: control_assessment

  purpose:
    - Calculate control assessment outcomes
    - Support compliance reporting
    - Provide consistent scoring across assessments


assessment_states:

  pass:
    value: 1
    description: >
      The control requirement is implemented and sufficient evidence
      has been provided.

  partial:
    value: 0.5
    description: >
      The control is partially implemented or evidence demonstrates
      incomplete compliance.

  fail:
    value: 0
    description: >
      The control requirement is not implemented or evidence does not
      demonstrate compliance.

  not_applicable:
    value: null
    description: >
      The control does not apply to the assessed environment.


control_scoring:

  calculation_method:
    type: weighted_average

  formula: >
    Total Score = Sum(Control Scores) / Applicable Controls * 100


  applicable_controls:
    include:
      - pass
      - partial
      - fail

    exclude:
      - not_applicable


score_percentages:

  pass:
    minimum: 100
    description: >
      All applicable controls have been successfully implemented.

  partial:
    minimum: 50
    maximum: 99
    description: >
      Some controls require improvement or additional evidence.

  fail:
    minimum: 0
    maximum: 49
    description: >
      Significant control gaps exist requiring remediation.


priority_weights:

  enabled: true

  method: priority_based_weighting

  weights:

    critical:
      value: 4

    high:
      value: 3

    medium:
      value: 2

    low:
      value: 1


weighted_calculation:

  formula: >
    Weighted Score =
    Sum(Control Result x Control Priority Weight) /
    Sum(Applicable Control Weights) * 100


control_result_mapping:

  pass:
    score: 1

  partial:
    score: 0.5

  fail:
    score: 0

  not_applicable:
    score: null


compliance_status:

  compliant:
    criteria:
      - "All critical controls pass"
      - "Overall score equals 100 percent"

  improvement_required:
    criteria:
      - "One or more controls are partial"
      - "Overall score below 100 percent"

  non_compliant:
    criteria:
      - "One or more critical controls fail"
      - "Security requirements are not adequately implemented"


critical_control_rules:

  enabled: true

  controls:

    - CE-UA-004
    - CE-MP-001
    - CE-SUM-001
    - CE-SUM-002

  failure_condition:
    - >
      Failure of a critical control prevents full compliance status.


reporting:

  outputs:

    - Overall compliance percentage
    - Control assessment summary
    - Failed controls list
    - Partial controls list
    - Remediation priorities
    - Evidence gaps


validation:

  schema_version: "1.0"

  checks:

    - "All assessment states defined"
    - "Scoring formula documented"
    - "Priority weighting defined"
    - "Control result mappings complete"
    - "Compatible with controls.yml identifiers"

  status: validated
