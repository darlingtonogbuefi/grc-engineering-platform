  - id: B2.a
    objective: B2 Identity and access control
    title: Identity verification, authentication and authorisation
    description: |
      Your process of initial identity verification is robust enough to provide a high level of confidence of a user’s identity profile before allowing an authorised user access to network and information systems that support your essential functions.

      Only authorised and individually authenticated users can physically access and logically connect to your network or information systems.

      Access is limited to the minimum necessary to support essential functions.

      Strong authentication mechanisms such as MFA are used for all user access including remote access.

      User and system access rights are reviewed regularly.
