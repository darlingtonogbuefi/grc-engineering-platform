    title: Identity and access management (IdAM)
    description: |
      Robust procedures verify users and issue minimum required access rights.

      User access rights are reviewed during joiners, movers and leavers processes and regularly thereafter.

      User, device and system access is logged and monitored.

      Access logs are reviewed and correlated with expected activity.

      Unauthorised access attempts are alerted, assessed and investigated.
