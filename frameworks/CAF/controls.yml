  - id: D1.a
    title: "D1 Response and recovery planning"
    control: "a. Response plan"
    description: |
      The incident response plan is based on a clear understanding of security risks affecting network and information systems supporting essential functions.

      The incident response plan covers the complete incident lifecycle, including preparation, detection, response, recovery, roles and responsibilities, communication and reporting requirements.

      The plan considers known attack patterns, emerging threats and previously unseen attack scenarios.

      Incident response planning is integrated with wider organisational business continuity plans, supply chain response plans and dependencies on supporting infrastructure.

      The incident response plan is communicated and understood by all business areas involved in operating essential functions.
