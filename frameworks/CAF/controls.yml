  - id: D1.b
    title: "D1 Response and recovery planning"
    control: "b. Response and recovery capability"
    description: |
      The organisation understands the resources required to perform incident response activities and has arrangements to make these resources available.

      Required information to support response decisions is identified and available to response teams.

      Incident response personnel have the skills, knowledge and authority required to make decisions and perform response actions.

      Critical roles are duplicated and operational knowledge is shared across personnel responsible for essential function recovery.

      Backup mechanisms are available to maintain operation of essential functions if primary systems fail or become unavailable.

      External specialist support can be obtained when additional incident response capability is required.
