  - id: D2.b
    title: "D2 Lessons learned"
    control: "b. Using incidents to drive improvements"
    description: |
      A documented incident review process ensures lessons learned from incidents and near misses are identified, recorded and acted upon.

      Lessons learned address reporting processes, roles, governance, skills, policies, procedures and technical controls.

      Incident findings are used to improve security measures and update response plans.

      Improvements are prioritised according to risk and completed promptly.

      Lessons learned are reported to senior management and incorporated into risk management and continuous improvement activities.

      The organisation uses internal incidents, sector incidents and wider infrastructure incidents to improve resilience.
