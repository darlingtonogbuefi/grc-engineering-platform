  - id: A2.c
    domain: A2 Risk management
    category: Risk management
    title: Assurance

    description: >
      Security measures protecting essential functions are validated as
      effective throughout their required lifetime.

      Appropriate assurance methods are selected, justified and reviewed.
      Security deficiencies identified through assurance activities are
      prioritised and remediated.

