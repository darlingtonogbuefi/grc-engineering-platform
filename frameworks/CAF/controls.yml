  - id: D2.a
    title: "D2 Lessons learned"
    control: "a. Post incident analysis"
    description: |
      Post incident analysis is performed routinely following security incidents as part of lessons learned activities.

      Analysis considers organisational factors, technical factors, human factors and changes in the threat environment.

      Relevant incident information is made available to support comprehensive investigation and review.

      Analysis considers alternative scenarios to identify additional improvements and understand potential impacts.
