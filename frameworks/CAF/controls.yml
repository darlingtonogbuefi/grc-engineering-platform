    objective: B2 Identity and access control
    title: Privileged user management
    description: |
      Privileged user access to network and information systems supporting essential functions is carried out from dedicated separate accounts that are closely monitored and managed.

      Temporary, time-bound privileged access is used for privileged user access and external third-party support.

      Privileged access rights are regularly reviewed and updated through joiners, movers and leavers processes.

      Privileged user activity is routinely reviewed, validated and recorded for investigation.
