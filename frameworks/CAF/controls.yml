  - id: D1.c
    title: "D1 Response and recovery planning"
    control: "c. Testing and exercising"
    description: |
      Incident response exercises use realistic scenarios based on previous incidents, sector experience, threat intelligence and emerging threats.

      Exercise scenarios are documented, reviewed and validated regularly.

      Exercises are performed routinely, with findings captured and used to improve incident response plans and security controls.

