    title: Device management
    description: |
      All privileged operations are conducted from highly trusted devices such as Privileged Access Workstations.

      Third-party devices and networks are independently assured before connection.

      Certificate-based device identity management is used and only known devices are allowed access.

      Regular scans detect unknown devices.
