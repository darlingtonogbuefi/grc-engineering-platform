  - id: B1.b
    objective: B1 Service protection policies and processes
    title: Policy, process and procedure implementation
    description: |
      All your policies, processes and procedures are followed, their correct application and security effectiveness is evaluated.

      Your policies, processes and procedures are integrated with other organisational policies, processes and procedures, including HR assessments of individuals' trustworthiness.

      Your policies, processes and procedures are effectively communicated across all levels of the organisation resulting in good staff awareness of their responsibilities.

      Appropriate action is taken to address all breaches of policies, processes and procedures with potential to adversely impact the essential functions including aggregated breaches.
