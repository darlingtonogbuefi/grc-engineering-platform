framework:
  id: CAF
  name: Cyber Assessment Framework
  version: "3.2"
  publisher: NCSC
  description: >
    NCSC Cyber Assessment Framework controls mapped to security principles,
    standards, vulnerabilities and implementation controls.

controls:

  - id: A1.a
    domain: A1 Governance
    category: Governance
    title: Board direction

    description: >
      Your organisation's approach and policy relating to the security of
      network and information systems supporting the operation of your
      essential functions are owned and managed at board level.

      Regular board-level discussions on security take place using timely
      and accurate information informed by expert guidance.

      Security is recognised as an important enabler for resilience of
      essential functions.

    references:
      nist:
        - PM-11 Mission and business process definition
        - SC-1 Policy and procedures

      caf_category:
        - Engagement and training

      principles:
        - Principle 4: Governance framework

      cis_controls:
        - "14.1 Establish and maintain a security awareness programme"
        - "14.2 Train workforce members to recognise social engineering attacks"
        - "14.6 Train workforce members on recognising and reporting security incidents"

      owasp:
        - "A03:2021 Injection"
        - "A05:2021 Security misconfiguration"
        - "A09:2021 Security logging and monitoring failures"

      iso27001:
        - "A.5 Information security policies"
        - "A.6 Organisation of information security"


  - id: A1.b
    domain: A1 Governance
    category: Governance
    title: Roles and responsibilities

    description: >
      Key roles and responsibilities for security of network and information
      systems supporting essential functions are identified, reviewed and
      assigned to capable personnel.

      Accountability for security responsibilities is clearly defined.

    references:
      nist:
        - PM-1 Information security programme plan
        - PS-9 Position Description

      caf_category:
        - Engagement and training

      principles:
        - Principle 4: Governance framework

      cis_controls:
        - "14.1 Establish and maintain a security awareness programme"
        - "14.9 Conduct role-specific security awareness and skills training"
        - "15.4 Ensure service provider contracts include security requirements"
        - "16.9 Train developers in application security concepts and secure coding"
        - "17.1 Designate personnel to manage incident handling"
        - "17.2 Establish and maintain contact information for reporting security incidents"
        - "17.4 Establish and maintain an incident response process"
        - "17.5 Assign key roles and responsibilities"

      owasp:
        - "A03:2021 Injection"
        - "A05:2021 Security misconfiguration"
        - "A09:2021 Security logging and monitoring failures"

      iso27001:
        - "A.5 Information security policies"
        - "A.6 Organisation of information security"


  - id: A1.c
    domain: A1 Governance
    category: Governance
    title: Decision-making

    description: >
      Senior management maintains visibility of security risk decisions.
      Decision makers understand responsibilities, authority and escalation
      routes.

      Risk management decisions are reviewed regularly for continued validity.

    references:
      nist:
        - PM-10 Authorisation process

      caf_category:
        - Engagement and training

      principles:
        - Principle 4: Governance framework

      cis_controls:
        - "17.1 Designate personnel to manage incident handling"
        - "17.4 Establish and maintain an incident response process"

      owasp:
        - "A03:2021 Injection"
        - "A05:2021 Security misconfiguration"
        - "A09:2021 Security logging and monitoring failures"

      iso27001:
        - "A.5 Information security policies"
        - "A.6 Organisation of information security"


  - id: A2.a
    domain: A2 Risk management
    category: Risk management
    title: Risk management process

    description: >
      Security risks affecting essential functions are identified, analysed,
      prioritised and managed.

      Risk assessments are threat informed, vulnerability aware and produce
      traceable security requirements.

    references:

      nist:
        - RA-1 Risk management

      caf_category:
        - Risk management

      principles:
