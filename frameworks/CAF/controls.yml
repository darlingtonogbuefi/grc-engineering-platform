  - id: A4.a
    domain: A4 Supply chain
    category: Supply chain security
    title: Supply chain

    description: >
      The organisation understands supply chain risks including suppliers,
      subcontractors and dependencies.

      Supplier security requirements are embedded into procurement,
      contractual arrangements and ongoing supplier management.

      Critical suppliers demonstrate appropriate cybersecurity protections.

