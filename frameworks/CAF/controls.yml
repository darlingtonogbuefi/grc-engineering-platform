      Monitoring data provides sufficient detail to detect incidents, support investigations and identify policy violations, suspicious behaviour, abnormal activity and deviations from expected system behaviour.

      Host-based and network monitoring capabilities are implemented across essential function systems.

      New systems are assessed as potential logging sources to maintain comprehensive monitoring coverage.

