  - id: B3.a
    objective: B3 Data security
    title: Understanding data
    description: |
      All data important to the operation of network and information systems supporting essential functions is identified and catalogued.

      Access, location, quantity and quality of important data is understood.

      Unnecessary copies and historic data are minimised.

      Data flows, dependencies and impacts from compromise scenarios are documented and reviewed.
