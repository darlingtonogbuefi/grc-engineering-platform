    objective: B3 Data security
    title: Data in transit
    description: |
      Data links carrying important data are identified and protected.

      Appropriate physical and technical controls, including cryptography, protect data travelling over untrusted networks.

      Alternative transmission paths are available where resource limitations create significant risks.
