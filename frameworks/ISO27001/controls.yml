framework:
  id: ISO27001
  name: ISO/IEC 27001
  version: "2022"
  publisher: ISO/IEC

  description: >
    ISO/IEC 27001:2022 Annex A controls represented as atomic
    assessment controls for evidence collection, compliance
    assessment, scoring and reporting.

    Controls are mapped exclusively to the
    NCSC Cyber Assessment Framework (CAF).

  scope:
    - Information Security Management Systems
    - Enterprise IT
    - Cloud services
    - Business applications
    - Infrastructure
    - Operational Technology
    - Third-party services

  assessment_model:
    type: control_assessment

    scoring:
      - pass
      - partial
      - fail
      - not_applicable


controls:


#
# Organizational Controls
#


- id: ISO27001-ORG-001
  theme: Organizational Controls
  category: Information Security Policy
  title: Information security policies

  requirement: >
    Information security policies shall be defined, approved,
    communicated and reviewed regularly.

  assessment_guidance: >
    Verify approved security policies exist, are communicated
    throughout the organisation and periodically reviewed.

  evidence:
    - Information Security Policy
    - Policy approval records
    - Policy review schedule
    - Communication records

  applicability:
    enterprise: true
    cloud: true

  priority: critical

  tags:
    - policy
    - governance
    - management

  caf_controls:
    - A1.a
    - A1.b


- id: ISO27001-ORG-002
  theme: Organizational Controls
  category: Roles and Responsibilities
  title: Information security roles and responsibilities

  requirement: >
    Information security responsibilities shall be defined and
    assigned.

  assessment_guidance: >
    Verify security responsibilities are documented and assigned.

  evidence:
    - Responsibility matrix
    - Organisation chart
    - Job descriptions

  applicability:
