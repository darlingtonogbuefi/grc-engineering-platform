validation:

  schema_version: "1.0"

  framework: "ISO/IEC 27001"

  annex: "Annex A (2022)"

  caf_mapping: true

  validation_status: validated

  structure_checks:
    - All controls contain unique identifiers
    - All controls include title
    - All controls include requirement
    - All controls include assessment guidance
    - All controls include evidence
    - All controls include applicability
    - All controls include priority
    - All controls include tags
    - All controls include CAF mappings
    - YAML syntax validated

  mapping_checks:
    caf:
      enabled: true
      mapping_type: control-to-CAF
      notes:
        - Controls are mapped exclusively to NCSC CAF.
        - No mappings to NIST CSF.
        - No mappings to CIS Controls.
        - No mappings to OWASP.
        - No mappings to other frameworks.

  evidence_alignment:
    supported: true
    notes:
      - Controls support evidence-based assessment.
      - Evidence items can be referenced through evidence.yml.

  scoring_alignment:
    supported: true
    notes:
      - Stable control identifiers support consistent scoring.
      - Compatible with scoring.yml.

  production_readiness:
    status: ready
    review_required:
      - Review following ISO/IEC 27001 revisions.
      - Review following NCSC CAF updates.
      - Review following significant technology or regulatory changes.
