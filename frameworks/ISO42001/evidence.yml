# ISO/IEC 42001 AI Management System Evidence Catalogue
# evidence.yml

framework: ISO42001
version: "2023"

evidence_model:
  type: evidence_catalogue

  purpose:
    - AI management system assessment
    - Evidence collection
    - Control verification
    - Compliance reporting


evidence_items:


  #
  # AI Governance
  #

  - id: ISO42001-EV-001
    name: AI governance policy
    description: >
      Approved policies defining AI governance requirements,
      responsibilities and operational expectations.

    evidence_type:
      - policy
      - governance_document

    related_controls:
      - ISO42001-GOV-001


  - id: ISO42001-EV-002
    name: AI responsibility matrix
    description: >
      Documentation identifying accountable owners and responsibilities
      for AI systems and AI management activities.

    evidence_type:
      - responsibility_record
      - governance_record

    related_controls:
      - ISO42001-GOV-002


  #
  # AI Risk Management
  #

  - id: ISO42001-EV-003
    name: AI risk assessment records
    description: >
      Records identifying, analysing and evaluating risks associated
      with AI systems.

    evidence_type:
      - risk_assessment
      - risk_record

    related_controls:
      - ISO42001-RM-001


  - id: ISO42001-EV-004
    name: AI risk treatment plans
    description: >
      Documented mitigation actions addressing identified AI risks.

    evidence_type:
      - remediation_record
      - risk_treatment_plan

    related_controls:
      - ISO42001-RM-002


  #
  # AI Lifecycle Management
  #

  - id: ISO42001-EV-005
    name: AI lifecycle documentation
    description: >
      Documentation describing AI system lifecycle stages,
      approvals and operational processes.

    evidence_type:
      - process_document
      - lifecycle_record

    related_controls:
      - ISO42001-LCM-001


  - id: ISO42001-EV-006
    name: AI change management records
    description: >
      Records showing changes to AI systems are assessed,
      approved and controlled.

    evidence_type:
      - change_record
      - approval_record

    related_controls:
      - ISO42001-LCM-002


  #
  # Data Governance
  #

  - id: ISO42001-EV-007
    name: AI data inventory
    description: >
      Inventory of datasets used, processed or generated by AI systems.

    evidence_type:
      - inventory
      - data_register

    related_controls:
      - ISO42001-DATA-001


  - id: ISO42001-EV-008
    name: Data governance procedures
    description: >
      Procedures defining ownership, management and governance of AI
      related data.

    evidence_type:
      - procedure
      - policy

    related_controls:
      - ISO42001-DATA-001


  - id: ISO42001-EV-009
    name: Data quality assessment records
    description: >
      Evidence showing validation, quality checks and assessment of
      AI data sources.

    evidence_type:
      - assessment_record
      - validation_report

    related_controls:
      - ISO42001-DATA-002


  #
  # Transparency and Explainability
  #

  - id: ISO42001-EV-010
    name: AI system documentation
    description: >
      Documentation describing AI system purpose, capabilities,
      limitations and intended use.

    evidence_type:
      - system_documentation
      - technical_documentation

    related_controls:
      - ISO42001-TRN-001


  - id: ISO42001-EV-011
    name: AI user information records
    description: >
      Information provided to users and stakeholders regarding AI
      system operation and usage.

    evidence_type:
      - communication_record
      - guidance_document

    related_controls:
      - ISO42001-TRN-001


  #
  # Human Oversight
  #

  - id: ISO42001-EV-012
    name: Human oversight procedures
    description: >
      Documented procedures defining human review, intervention and
      escalation requirements.

    evidence_type:
      - procedure
      - workflow_document

    related_controls:
      - ISO42001-HUM-001


  - id: ISO42001-EV-013
    name: AI decision review records
    description: >
      Records demonstrating human review of AI-supported decisions.

    evidence_type:
      - review_record
      - approval_record

    related_controls:
      - ISO42001-HUM-001


  #
  # AI Security
  #

  - id: ISO42001-EV-014
    name: AI security assessment
    description: >
      Security assessments identifying threats, weaknesses and
      protective measures for AI systems.

    evidence_type:
      - security_assessment
      - technical_report

    related_controls:
      - ISO42001-SEC-001


  - id: ISO42001-EV-015
    name: AI access control records
    description: >
      Records demonstrating authorised access management for AI
      systems and supporting platforms.

    evidence_type:
      - access_record
      - identity_record

    related_controls:
      - ISO42001-SEC-001


  - id: ISO42001-EV-016
    name: AI monitoring records
    description: >
      Logs, alerts and monitoring outputs showing AI system security
      and operational monitoring.

    evidence_type:
      - monitoring_record
      - security_event

    related_controls:
      - ISO42001-SEC-002


  #
  # Improvement
  #

  - id: ISO42001-EV-017
    name: AI performance review records
    description: >
      Periodic reviews evaluating AI system effectiveness,
      performance and improvement opportunities.

    evidence_type:
      - review_record
      - performance_report

    related_controls:
      - ISO42001-IMP-001


  - id: ISO42001-EV-018
    name: AI improvement action records
    description: >
      Records showing corrective and continual improvement actions
      resulting from AI system reviews.

    evidence_type:
      - improvement_record
      - action_plan

    related_controls:
      - ISO42001-IMP-001



evidence_requirements:

  mandatory:

    - id: ER-001
      requirement: >
        Evidence must be attributable to the organisation,
        AI system or responsible owner.

    - id: ER-002
      requirement: >
        Evidence must demonstrate implementation of the associated
        AI management system control.

    - id: ER-003
      requirement: >
        Evidence must be current and representative of the assessed
        AI environment.


assessment_states:

  accepted:
    description: >
      Evidence demonstrates effective implementation of the control.

  insufficient:
    description: >
      Evidence does not fully demonstrate implementation.

  unavailable:
    description: >
      Required evidence has not been provided.


relationships:

  control_reference_field: related_controls
  evidence_reference_field: id
