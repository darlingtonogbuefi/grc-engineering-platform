# GovAssure Security Assessment Control Framework
# controls.yml

framework:
  id: GOVASSURE
  name: GovAssure
  version: "2024"

  publisher:
    name: UK Government
    organisation: Cabinet Office

  description: >
    Atomic security assessment controls representing GovAssure
    requirements for government technology systems.

    Controls are structured for evidence collection, assessment,
    scoring and reporting.

    Controls are mapped exclusively to the NCSC Cyber Assessment
    Framework (CAF).

  scope:
    - Government technology systems
    - Enterprise services
    - Cloud environments
    - Digital services
    - Infrastructure platforms
    - Third-party technology services

  assessment_model:
    type: control_assessment

    scoring:
      - pass
      - partial
      - fail
      - not_applicable


controls:


  #
  # Governance and Risk Management
  #

  - id: GA-GOV-001
    theme: Governance and Risk Management
    category: Security Governance
    title: Security governance framework

    requirement: >
      The organisation maintains governance arrangements that define
      cybersecurity responsibilities, decision making and oversight.

    assessment_guidance: >
      Verify security governance structures, ownership responsibilities
      and reporting arrangements are documented and operating.

    evidence:
      - Security governance framework
      - Organisation charts
      - Security committee records
      - Security policies

    applicability:
      enterprise: true

    priority: high

    tags:
      - governance
      - accountability
      - security-management

    caf_controls:
      - A1.a
      - A1.b


  - id: GA-GOV-002
    theme: Governance and Risk Management
    category: Risk Management
    title: Cyber risk management process

    requirement: >
      Cybersecurity risks are identified, assessed, recorded and
      managed through defined processes.

    assessment_guidance: >
      Review risk registers, assessments and remediation activities.

    evidence:
      - Risk register
      - Risk assessments
      - Treatment plans

    applicability:
      enterprise: true

    priority: critical

    tags:
      - risk-management
      - cyber-risk

    caf_controls:
      - A2.a
      - A2.b
      - A2.c


  #
  # Asset Management
  #

  - id: GA-AM-001
    theme: Asset Management
    category: Asset Identification
    title: Technology asset inventory

    requirement: >
      Technology assets supporting government services are identified,
      recorded and maintained.

    assessment_guidance: >
      Verify inventories include hardware, software, services and
      ownership information.

    evidence:
      - Asset inventory
      - Configuration management database
      - Service catalogue

    applicability:
      enterprise: true

    priority: high

    tags:
      - asset-management
      - inventory

    caf_controls:
      - A3.a
      - B4.d


  #
  # Identity and Access Management
  #

  - id: GA-IAM-001
    theme: Identity and Access Management
    category: Identity Management
    title: User identity management

    requirement: >
      User identities are uniquely identified and managed throughout
      their lifecycle.

    assessment_guidance: >
      Confirm identity processes exist for account creation,
      modification and removal.

    evidence:
      - Identity management records
      - User account inventory
      - Joiner mover leaver process

    applicability:
      enterprise: true

    priority: high

    tags:
      - identity
      - account-management

    caf_controls:
      - B2.a
      - B2.d


  - id: GA-IAM-002
    theme: Identity and Access Management
    category: Privileged Access
    title: Privileged access management

    requirement: >
      Privileged access is restricted, controlled and monitored.

    assessment_guidance: >
      Verify administrator accounts are controlled and protected.

    evidence:
      - Privileged account inventory
      - PAM configuration
      - Access reviews

    applicability:
      enterprise: true

    priority: critical

    tags:
      - privileged-access
      - administration

    caf_controls:
      - B2.c
      - B4.c


  - id: GA-IAM-003
    theme: Identity and Access Management
    category: Authentication
    title: Strong authentication controls

    requirement: >
      Appropriate authentication mechanisms are implemented to protect
      access to systems and services.

    assessment_guidance: >
      Review MFA implementation and authentication policies.

    evidence:
      - MFA configuration
      - Authentication policies
      - Identity provider reports

    applicability:
      enterprise: true
      cloud: true

    priority: critical

    tags:
      - authentication
      - mfa

    caf_controls:
      - B2.a
      - B2.c


  #
  # Secure Configuration
  #

  - id: GA-SC-001
    theme: Secure Configuration
    category: System Hardening
    title: Secure system configuration

    requirement: >
      Systems are configured securely using approved security
      baselines.

    assessment_guidance: >
      Verify hardened configurations are defined and implemented.

    evidence:
      - Secure build standards
      - Configuration baselines
      - Compliance reports

    applicability:
      enterprise: true
      cloud: true

    priority: high

    tags:
      - hardening
      - configuration

    caf_controls:
      - B4.a
      - B4.b


  #
  # Vulnerability Management
  #

  - id: GA-VULN-001
    theme: Vulnerability Management
    category: Vulnerability Identification
    title: Vulnerability assessment process

    requirement: >
      Vulnerabilities affecting systems and services are identified
      and managed.

    assessment_guidance: >
      Review vulnerability scanning, remediation and reporting
      processes.

    evidence:
      - Vulnerability scans
      - Remediation records
      - Risk reports

    applicability:
      enterprise: true

    priority: critical

    tags:
      - vulnerabilities
      - remediation

    caf_controls:
      - A2.b
      - A2.c
      - B4.d


  #
  # Security Monitoring
  #

  - id: GA-MON-001
    theme: Security Monitoring
    category: Detection
    title: Security event monitoring

    requirement: >
      Security events are monitored, detected and analysed.

    assessment_guidance: >
      Confirm monitoring capabilities detect relevant security events.

    evidence:
      - SIEM records
      - Security alerts
      - Monitoring dashboards

    applicability:
      enterprise: true

    priority: high

    tags:
      - monitoring
      - detection
      - siem

    caf_controls:
      - C1.a
      - C1.d


  #
  # Incident Management
  #

  - id: GA-INC-001
    theme: Incident Management
    category: Response Planning
    title: Cyber incident response capability

    requirement: >
      The organisation maintains processes to respond to cybersecurity
      incidents.

    assessment_guidance: >
      Verify incident procedures, escalation routes and response
      exercises.

    evidence:
      - Incident response plan
      - Incident records
      - Exercise reports

    applicability:
      enterprise: true

    priority: critical

    tags:
      - incident-response
      - resilience

    caf_controls:
      - D1.a
      - D2.a


  #
  # Supplier Security
  #

  - id: GA-SUP-001
    theme: Supplier Security
    category: Third Party Risk
    title: Supplier security assurance

    requirement: >
      Security risks associated with suppliers and third parties are
      identified and managed.

    assessment_guidance: >
      Review supplier assessments, contracts and assurance activities.

    evidence:
      - Supplier risk assessments
      - Contracts
      - Assurance reports

    applicability:
      enterprise: true

    priority: high

    tags:
      - supplier-risk
      - third-party

    caf_controls:
      - A1.b
      - A2.a


  #
  # Data Protection
  #

  - id: GA-DATA-001
    theme: Data Protection
    category: Information Security
    title: Protection of sensitive information

    requirement: >
      Information is protected against unauthorised access,
      disclosure or modification.

    assessment_guidance: >
      Review data protection controls including access restrictions
      and protective measures.

    evidence:
      - Data classification policy
      - Access controls
      - Encryption records

    applicability:
      enterprise: true

    priority: high

    tags:
      - data-protection
      - confidentiality

    caf_controls:
      - B5.a
      - B5.b
