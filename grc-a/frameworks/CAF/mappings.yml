framework:
  id: CAF
  name: Cyber Assessment Framework
  version: "3.2"
  publisher: NCSC

mapping_library:
  version: "1.0"
  description: >
    Cross-framework mappings between NCSC Cyber Assessment Framework controls
    and recognised cybersecurity standards including NIST 800-53, CIS Controls,
    ISO 27001 and OWASP Top 10.

mapping_types:
  - caf_to_nist_800_53
  - caf_to_cis_controls
  - caf_to_iso27001
  - caf_to_owasp
  - caf_to_principles


mappings:

