#
# Validation
#

validation:

  schema_version: "1.0"

  framework: ISO27001

  mapping_status: validated


  checks:

    - All ISO27001 controls have CAF mappings
    - All CAF references follow approved format
    - No external framework mappings included
    - Mapping identifiers are unique
    - YAML structure validated


  production_readiness:

    status: ready

    review_required:

      - Review when ISO/IEC 27001 Annex A changes
      - Review when NCSC CAF guidance changes
      - Review following organisational scope changes
