#
# ISO/IEC 27001:2022 Annex A CAF Mapping Catalogue
# mappings.yml
#

framework:

  id: ISO27001

  name: ISO/IEC 27001

  version: "2022"

  mapping_target:

    id: CAF

    name: NCSC Cyber Assessment Framework


mapping_model:

  type: control_to_framework_mapping

  source:
    framework: ISO/IEC 27001
    component: Annex A Controls

  target:
    framework: NCSC CAF

  rules:

    - ISO27001 controls are mapped only to CAF outcomes.
    - No mappings to NIST, CIS, OWASP, COBIT or ISO clauses are included.
    - Mappings represent security outcome alignment.



