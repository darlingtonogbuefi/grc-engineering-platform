# Cyber Essentials Control Mapping Catalogue
# mappings.yml

framework: Cyber Essentials
version: "2023"

mapping_model:
  type: control_mapping
  purpose:
    - CAF alignment
    - Control traceability
    - Assessment reporting

mapping_scope:
  source_framework: Cyber Essentials
  target_framework: NCSC Cyber Assessment Framework (CAF)
  mapping_restrictions:
    - Only CAF references are included
    - No NIST mappings
    - No CIS mappings
    - No ISO mappings
    - No OWASP mappings


