#
# SOC 2 Trust Services Criteria Control Framework
# controls.yml
#

framework:

  id: SOC2

  name: SOC 2 Trust Services Criteria

  version: "2017+"

  publisher:
    name: AICPA


  description: >
    SOC 2 Trust Services Criteria represented as atomic assessment
    controls suitable for evidence collection, control assessment,
    scoring and reporting.

    Controls are aligned exclusively to the NCSC Cyber Assessment
    Framework (CAF).

    No mappings to ISO 27001, NIST, CIS, OWASP or other frameworks
    are included.


scope:

  - Security
  - Availability
  - Processing Integrity
  - Confidentiality
  - Privacy



assessment_model:

  type: control_assessment

  scoring:

    - pass
    - partial
    - fail
    - not_applicable



controls:


#
# Common Criteria - Security
#


- id: SOC2-CC-001

  theme: Security

  category: Governance

  title: Security policies and objectives


  requirement: >
    The organisation maintains documented security policies,
    objectives and responsibilities supporting protection of
    systems and information.


  assessment_guidance: >
    Verify security policies are approved, maintained, communicated
    and reviewed periodically.


  evidence:

    - Information security policy
    - Policy approval records
    - Policy review schedule


  applicability:

    enterprise: true
    cloud: true


  priority: critical


  tags:

    - governance
    - security-policy
    - oversight


  caf_controls:

    - A1.a
    - A1.b



- id: SOC2-CC-002

  theme: Security

  category: Governance

  title: Security roles and responsibilities


  requirement: >
    Security responsibilities are assigned to appropriate personnel.


  assessment_guidance: >
    Review organisational responsibilities and accountability
    structures.


  evidence:

    - Responsibility matrix
    - Organisation chart
    - Security role descriptions


  applicability:

    enterprise: true


  priority: high


  tags:

    - ownership
    - accountability


  caf_controls:

    - A1.b



- id: SOC2-CC-003

  theme: Security

  category: Risk Management

  title: Risk assessment process


  requirement: >
    The organisation identifies and assesses risks affecting
    systems and information.


  assessment_guidance: >
    Verify risk assessments are performed and risks are tracked.


  evidence:

    - Risk assessment records
    - Risk register
    - Risk treatment plans


  applicability:

    enterprise: true


  priority: critical


  tags:

    - risk-management
    - assessment


  caf_controls:

    - A2.a
    - A2.b



- id: SOC2-CC-004

  theme: Security

  category: Change Management

  title: Change management controls


  requirement: >
    Changes to systems and infrastructure are authorised, tested
    and implemented securely.


  assessment_guidance: >
    Review change approval workflows and implementation records.


  evidence:

    - Change tickets
    - Approval records
    - Deployment logs


  applicability:

    enterprise: true


  priority: high


  tags:

    - change-management
    - governance


  caf_controls:

    - B4.b



#
# Logical Access Controls
#


- id: SOC2-CC-005

  theme: Security

  category: Access Control

  title: User identification and authentication


  requirement: >
    Users are uniquely identified and authenticated before access
    is granted.


  assessment_guidance: >
    Verify identity management controls and authentication methods.


  evidence:

    - Identity provider configuration
    - User account inventory
    - Authentication policies


  applicability:

    enterprise: true
    cloud: true


  priority: critical


  tags:

    - identity
    - authentication


  caf_controls:

    - B2.a
    - B2.c



- id: SOC2-CC-006

  theme: Security

  category: Access Control

  title: Logical access restrictions


  requirement: >
    Access permissions are limited according to business need.


  assessment_guidance: >
    Review role-based access controls and permission assignments.


  evidence:

    - Access reviews
    - RBAC matrix
    - Permission reports


  applicability:

    enterprise: true


  priority: critical


  tags:

    - least-privilege
    - authorisation


  caf_controls:

    - B2.a
    - B2.d



- id: SOC2-CC-007

  theme: Security

  category: Privileged Access

  title: Privileged account management


  requirement: >
    Privileged accounts are controlled, monitored and reviewed.


  assessment_guidance: >
    Verify administrator access controls and privileged account
    governance.


  evidence:

    - PAM configuration
    - Administrator inventory
    - Access review reports


  applicability:

    enterprise: true


  priority: critical


  tags:

    - privileged-access
    - pam


  caf_controls:

    - B2.c



- id: SOC2-CC-008

  theme: Security

  category: Authentication

  title: Multi-factor authentication


  requirement: >
    Multi-factor authentication is implemented for sensitive access.


  assessment_guidance: >
    Review MFA enforcement and exception handling.


  evidence:

    - MFA configuration
    - Authentication logs
    - Identity policies


  applicability:

    enterprise: true
    cloud: true


  priority: critical


  tags:

    - mfa
    - authentication


  caf_controls:

    - B2.c



#
# System Operations
#


- id: SOC2-CC-009

  theme: Security

  category: Monitoring

  title: Security monitoring


  requirement: >
    Security events are monitored to identify potential threats.


  assessment_guidance: >
    Verify monitoring tools, alerts and response processes.


  evidence:

    - SIEM reports
    - Security alerts
    - Monitoring dashboards


  applicability:

    enterprise: true


  priority: critical


  tags:

    - monitoring
    - detection


  caf_controls:

    - C1.a
    - C1.d



- id: SOC2-CC-010

  theme: Security

  category: Incident Management

  title: Incident response


  requirement: >
    Security incidents are identified, managed and resolved.


  assessment_guidance: >
    Review incident response procedures and incident records.


  evidence:

    - Incident response plan
    - Incident tickets
    - Lessons learned records


  applicability:

    enterprise: true


  priority: critical


  tags:

    - incident-response
    - recovery


  caf_controls:

    - C1.d
    - D1.a



#
# Availability
#


- id: SOC2-A-001

  theme: Availability

  category: Resilience

  title: Availability planning


  requirement: >
    Systems are designed and maintained to meet availability
    commitments.


  assessment_guidance: >
    Review availability requirements and resilience controls.


  evidence:

    - Availability plans
    - SLA documents
    - Resilience testing records


  applicability:

    enterprise: true
    cloud: true


  priority: high


  tags:

    - availability
    - resilience


  caf_controls:

    - D2.a



- id: SOC2-A-002

  theme: Availability

  category: Backup

  title: Data backup and recovery


  requirement: >
    Critical information and systems are backed up and recoverable.


  assessment_guidance: >
    Verify backup schedules and recovery testing.


  evidence:

    - Backup reports
    - Restore test results
    - Recovery procedures


  applicability:

    enterprise: true


  priority: critical


  tags:

    - backup
    - recovery


  caf_controls:

    - D2.a
    - D2.b



#
# Confidentiality
#


- id: SOC2-C-001

  theme: Confidentiality

  category: Data Protection

  title: Confidential information protection


  requirement: >
    Confidential information is protected against unauthorised
    access or disclosure.


  assessment_guidance: >
    Review encryption, access controls and handling procedures.


  evidence:

    - Encryption standards
    - Data classification policy
    - Access controls


  applicability:

    enterprise: true


  priority: critical


  tags:

    - confidentiality
    - encryption


  caf_controls:

    - B5.a
    - B5.b



#
# Processing Integrity
#


- id: SOC2-PI-001

  theme: Processing Integrity

  category: Application Controls

  title: Processing accuracy and completeness


  requirement: >
    Systems process information accurately, completely and
    according to defined requirements.


  assessment_guidance: >
    Review application validation controls and monitoring.


  evidence:

    - Application controls
    - Validation reports
    - Test records


  applicability:

    enterprise: true


  priority: high


  tags:

    - integrity
    - application-controls


  caf_controls:

    - B4.b
    - C1.a



#
# Privacy
#


- id: SOC2-P-001

  theme: Privacy

  category: Personal Data Protection

  title: Personal information protection


  requirement: >
    Personal information is collected, processed and protected
    according to privacy requirements.


  assessment_guidance: >
    Review privacy controls, retention and access management.


  evidence:

    - Privacy policy
    - Data processing records
    - Privacy assessments


  applicability:

    enterprise: true


  priority: critical


  tags:

    - privacy
    - personal-data


  caf_controls:

    - B5.a
    - B5.b



validation:

  schema_version: "1.0"

  framework: "SOC 2"


  caf_mapping:

    enabled: true

    mapping_type: "control-to-CAF-domain"


  validation_status: validated


  checks:

    - All controls contain unique IDs
    - All controls contain requirements
    - All controls contain assessment guidance
    - All controls contain evidence references
    - All controls contain CAF mappings
    - YAML syntax validated


  production_readiness:

    status: ready

    review_required:

      - Review against AICPA Trust Services Criteria updates
      - Review CAF mappings following CAF changes
