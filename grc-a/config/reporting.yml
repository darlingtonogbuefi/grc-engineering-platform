#   config\reporting.yml

# ==============================================================================
# Reporting Configuration
# ==============================================================================

schemaVersion: "1.0"

defaults:
  timezone: UTC

  language: en-GB

  includeExecutiveSummary: true

  includeEvidence: true

  includeRecommendations: true

  includeRiskMatrix: true

  includeControlDetails: true

profiles:
  executive:
    formats:
      - html

      - pdf

    dashboards:
      - executive

    includeTechnicalEvidence: false

    includeRawEvidence: false

    includeControlMappings: false

  technical:
    formats:
      - html

      - json

      - markdown

    dashboards:
      - technical

      - trends

    includeTechnicalEvidence: true

    includeRawEvidence: true

    includeApiResponses: false

  audit:
    formats:
      - pdf

      - html

      - json

      - csv

    includeRawEvidence: true

    includeControlMappings: true

    includeEvidenceMetadata: true

branding:
  organisation: Example Organisation

  reportTitle: GRC Compliance Report

  footer: Generated by GRC Engineering Platform

riskRatings:
  critical:
    score: 90

  high:
    score: 70

  medium:
    score: 50

  low:
    score: 25

scheduling:
  daily:
    cron: "0 2 * * *"

  weekly:
    cron: "0 2 * * 1"

  monthly:
    cron: "0 2 1 * *"

notifications:
  enabled: false

  providers:
    - email
    - teams

exports:
  html: true

  pdf: true

  json: true

  markdown: true

  csv: true

  powerbi: true
