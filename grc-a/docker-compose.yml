# ==============================================================================
# GRC Engineering Platform
# Local Development Environment
# ==============================================================================

services:

  grc-engine:

    container_name: grc-engine

    build:

      context: .

      dockerfile: Dockerfile


    env_file:

      - .env


    volumes:

      - ./config:/app/config:ro

      - ./frameworks:/app/frameworks:ro

      - ./collectors:/app/collectors:ro

      - ./schemas:/app/schemas:ro

      - ./evidence:/app/evidence

      - ./reports:/app/reports

      - ./output:/app/output


    restart: unless-stopped


    environment:

      APP_ENV: ${APP_ENV}

      LOG_LEVEL: ${LOG_LEVEL}

      DEFAULT_TENANT: ${DEFAULT_TENANT}

      CONFIG_PATH: /app/config

      FRAMEWORK_PATH: /app/frameworks

      EVIDENCE_PATH: /app/evidence

      REPORT_PATH: /app/reports


  # ---------------------------------------------------------------------------
  # Optional local object storage
  # ---------------------------------------------------------------------------

  minio:

    image: minio/minio:latest


    container_name: grc-minio


    command:

      - server

      - /data

      - --console-address

      - ":9001"


    ports:

      - "9000:9000"

      - "9001:9001"


    environment:

      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}

      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}


    volumes:

      - minio-data:/data


    restart: unless-stopped


volumes:

  minio-data:
