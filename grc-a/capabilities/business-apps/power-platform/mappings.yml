id: powerplatform

name: Microsoft Power Platform Framework Mappings

version: "1.0.0"

description: >
  Maps Microsoft Power Platform governance and security capability
  controls to recognised cybersecurity and compliance frameworks.
  These mappings allow Power Platform evidence to contribute toward
  multiple compliance assessments without embedding framework logic
  into the capability model.


mappings:


  #
  # PP-001 Tenant Governance
  #

  PP-001:

    name: Power Platform Tenant Governance


    frameworks:


      CAF:

        controls:

          - id: B1.a
            name: Governance and leadership


          - id: B3.a
            name: Security governance



      ISO27001:

        controls:

          - id: A.5.1
            name: Policies for information security


          - id: A.5.2
            name: Information security roles and responsibilities


          - id: A.5.37
            name: Documented operating procedures



      SOC2:

        controls:

          - id: CC1.2

          - id: CC1.3



      GovAssure:

        controls:

          - id: GV.OC
            name: Governance and oversight



      CyberEssentials:

        controls:

          - id: Secure Configuration



  #
  # PP-002 Environment Governance
