#collectors\azure\queries\subscriptions.yml

id: azure.subscriptions
name: Azure Subscriptions
description: >
  Collect Azure subscription metadata and configuration details
  for inventory, governance, ownership, and compliance evidence.

service: Microsoft.Resources
resource: subscriptions
method: GET
endpoint: /subscriptions
api_version: "2024-03-01"
scope: tenant

pagination:
  enabled: true
  next_link: nextLink

authentication:
  type: bearer

response:
  items: value

normalizer: SubscriptionNormalizer
primary_key: subscriptionId

fields:
  - id
  - subscriptionId
  - displayName
  - tenantId
  - state
  - subscriptionPolicies
  - authorizationSource
  - managedByTenants
  - tags

collection:
  retry:
    enabled: true
    max_attempts: 3

  timeout_seconds: 60

  throttling:
    enabled: true

failure_policy:
  continue_on_error: true
  store_errors: true

metadata:
  category: inventory
  evidence_type: subscription_inventory
  provider: azure
  version: 1

profiles:
  - default
  - cyberessentials
  - caf
  - govassure
  - iso27001
  - iso42001
  - soc2
  - full
