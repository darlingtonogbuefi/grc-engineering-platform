# collectors/azure/queries/backup-vaults.yml
id: azure.backup_vaults
name: Azure Backup Vaults
description: >
  Collect Azure Backup vault configurations for backup,
  recovery, and resilience evidence.

service: Microsoft.DataProtection
resource: backupVaults
method: GET
endpoint: /subscriptions/{subscriptionId}/providers/Microsoft.DataProtection/backupVaults
api_version: "2024-04-01"
scope: subscription

pagination:
  enabled: true
  next_link: nextLink

authentication:
  type: bearer

response:
  items: value

normalizer: StorageNormalizer
primary_key: id

fields:
  - id
  - name
  - type
  - location
  - tags
  - identity
  - properties
  - properties.storageSettings
  - properties.monitoringSettings
  - properties.securitySettings
  - properties.encryptionSettings

metadata:
  category: resilience
  evidence_type: backup_configuration
  provider: azure
  version: 1

profiles:
  - default
  - cyberessentials
  - caf
  - govassure
  - iso27001
  - iso42001
  - soc2
  - full
