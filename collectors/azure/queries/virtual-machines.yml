# collectors\azure\queries\virtual-machines.yml

id: azure.virtual_machines

name: Azure Virtual Machines

description: >
  Collect Azure Virtual Machine configurations including compute
  properties, operating system details, security settings,
  network associations, and resource metadata for security
  and compliance assessments.

service: Microsoft.Compute
resource: virtualMachines

method: GET

endpoint: /subscriptions/{subscriptionId}/providers/Microsoft.Compute/virtualMachines

api_version: "2024-03-01"

scope: subscription

pagination:
  enabled: true
  next_link: nextLink

authentication:
  type: bearer

response:
  items: value

normalizer: ComputeNormalizer

primary_key: id

fields:
  - id
  - name
  - type
  - location
  - tags
  - properties
  - properties.vmId
  - properties.hardwareProfile
  - properties.hardwareProfile.vmSize
  - properties.storageProfile
  - properties.storageProfile.imageReference
  - properties.storageProfile.osDisk
  - properties.storageProfile.dataDisks
  - properties.osProfile
  - properties.osProfile.computerName
  - properties.osProfile.adminUsername
  - properties.networkProfile
  - properties.networkProfile.networkInterfaces
  - properties.provisioningState
  - properties.instanceView

collection:
  retry:
    enabled: true
    max_attempts: 3

  timeout_seconds: 60

  throttling:
    enabled: true

failure_policy:
  continue_on_error: true
  store_errors: true

metadata:
  category: compute_security
  evidence_type: virtual_machine_configuration
  provider: azure
  version: 1

profiles:
  - default
  - cyberessentials
  - caf
  - govassure
  - iso27001
  - iso42001
  - soc2
  - full
