


[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]

name = "grc-engineering-platform"

version = "0.1.0"

description = "Enterprise-grade GRC engineering and evidence automation platform supporting CAF, ISO 27001, SOC 2, GovAssure, and Cyber Essentials frameworks"

readme = "README.md"

requires-python = ">=3.11"


authors = [
    {
        name = "GRC Engineering Platform Team"
    }
]


license = {
    text = "Apache-2.0"
}


keywords = [
    "grc",
    "governance",
    "risk",
    "compliance",
    "security",
    "audit",
    "assurance",
    "evidence",
    "automation",
    "frameworks",
    "iso27001",
    "soc2",
    "caf",
    "govassure",
    "cyberessentials"
]


classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]


dependencies = [

    "pyyaml>=6.0.1",

    "jsonschema>=4.21.0",

    "pydantic>=2.5.0",

    "python-dotenv>=1.0.0",

    "requests>=2.31.0",

    "httpx>=0.26.0",

    "tenacity>=8.2.3",

    "rich>=13.7.0",

    "click>=8.1.7",

    "jinja2>=3.1.3",

    "pandas>=2.2.0",

    "openpyxl>=3.1.2",

    "python-dateutil>=2.8.2"
]


[project.optional-dependencies]


azure = [

    "azure-identity>=1.15.0",

    "azure-storage-blob>=12.19.0",

    "azure-mgmt-resource>=23.0.1"

]


microsoft = [

    "msgraph-sdk>=1.0.0"

]


github = [

    "PyGithub>=2.1.1"

]


vmware = [

    "pyvmomi>=8.0.2"

]


govassure = [

    "jsonschema>=4.21.0",

    "lxml>=5.1.0",

    "openpyxl>=3.1.2",

    "python-dateutil>=2.8.2"
]


all = [

    "azure-identity>=1.15.0",

    "azure-storage-blob>=12.19.0",

    "azure-mgmt-resource>=23.0.1",

    "msgraph-sdk>=1.0.0",

    "PyGithub>=2.1.1",

    "pyvmomi>=8.0.2",

    "lxml>=5.1.0"
]


[project.scripts]

grc-engine = "engine.main:main"


[tool.setuptools]

packages = [
    "engine",
    "collectors"
]


[tool.ruff]

line-length = 120

target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "output",
    "evidence"
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


[tool.pytest.ini_options]

testpaths = [
    "tests"
]


python_files = [
    "test_*.py"
]


[tool.mypy]

python_version = "3.11"

ignore_missing_imports = true
