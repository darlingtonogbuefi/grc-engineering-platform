# ==============================================================================
# GRC Engineering Platform
# Notification Configuration
# ==============================================================================
#
# Controls notifications generated by the platform.
#
# ==============================================================================

schemaVersion: "1.0"

notifications:

  enabled: true

email:

  enabled: true

  smtpServer: smtp.company.com

  port: 587

  useSsl: true

  sender: grc-platform@company.com

  recipients:

    - grc@company.com

teams:

  enabled: false

  webhook: ""

slack:

  enabled: false

  webhook: ""

events:

  collectionCompleted: true

  collectionFailed: true

  reportGenerated: true

  dashboardPublished: true

  validationFailed: true

severity:

  information: true

  warning: true

  error: true

metadata:

  owner: GRC Engineering Platform

  schema: "1.0"
